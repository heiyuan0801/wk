name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Loopback load smoke test
        env:
          WK_LOADTEST: '1'
          WK_LOAD_CONCURRENCY: '10'
          WK_LOAD_DURATION: '1s'
        run: go test ./cmd/server -run '^TestProxyLoad$' -count=1 -timeout=60s

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag workbuddy2api:ci .
